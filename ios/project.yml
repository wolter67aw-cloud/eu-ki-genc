name: KIGenC
options:
  bundleIdPrefix: eu.kigenc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KIGenC:
    type: application
    platform: iOS
    sources:
      - path: KIGenC
    info:
      path: KIGenC/Info.plist
      properties:
        CFBundleDisplayName: KI-GenC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "KI-GenC nutzt das Mikrofon für Spracheingabe und Audio-Aufnahmen zur Transkription."
        NSSpeechRecognitionUsageDescription: "KI-GenC wandelt deine gesprochenen Worte in Text um."
        NSCameraUsageDescription: "KI-GenC nutzt die Kamera, damit du Fotos für die KI aufnehmen kannst."
        NSPhotoLibraryAddUsageDescription: "KI-GenC speichert erzeugte und bearbeitete Bilder in deiner Fotomediathek."
    settings:
      base:
        PRODUCT_NAME: KIGenC
        PRODUCT_BUNDLE_IDENTIFIER: eu.kigenc.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
