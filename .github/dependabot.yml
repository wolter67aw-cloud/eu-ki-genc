# Hält Bibliotheken und Build-Werkzeuge (Kotlin, Compose, Android-Gradle-Plugin, Gradle) automatisch aktuell.
# GitHub-Aktionen sind über ihre Hauptversion (z. B. @v7) eingebunden und erhalten Fehlerkorrekturen von selbst.
# Dependabot sammelt jede Woche alle neuen Versionen in EINEM Pull-Request.
# Der Workflow „Automatische Updates“ baut ihn testweise und führt ihn bei Erfolg selbst zusammen –
# danach entsteht automatisch eine neue App-Version, die sich auf den Geräten selbst installiert.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      alle-bibliotheken:
        patterns: [ "*" ]
