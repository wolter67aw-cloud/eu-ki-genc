# Hält Bibliotheken und Build-Werkzeuge automatisch aktuell:
# Dependabot öffnet wöchentlich Pull-Requests mit neuen Versionen.
# Nach dem Zusammenführen baut GitHub Actions eine neue APK – die App aktualisiert sich dann selbst.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      androidx:
        patterns: [ "androidx.*" ]
      kotlin:
        patterns: [ "org.jetbrains.kotlin*", "org.jetbrains.kotlinx*" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
