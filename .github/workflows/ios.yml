name: iOS-App bauen

on:
  push:
    branches: [main, dev]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac-Runner (macos-15-intel, macos-latest, macos-26)"
        default: macos-15-intel

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    env:
      # Secrets bevorzugt; falls versehentlich als „Variables“ angelegt, werden diese ebenfalls genutzt.
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 || vars.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
      VARS_USED: ${{ vars.APPLE_TEAM_ID != '' || vars.APP_STORE_CONNECT_KEY_ID != '' || vars.APP_STORE_CONNECT_ISSUER_ID != '' || vars.APP_STORE_CONNECT_KEY_P8 != '' }}
      P8_AS_VAR: ${{ vars.APP_STORE_CONNECT_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Xcode wählen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Projekt erzeugen (XcodeGen)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Kompilieren (Simulator, ohne Signatur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project KIGenC.xcodeproj -scheme KIGenC \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log | head -50; exit 1; }

      - name: Hinweis zu Variables
        if: env.VARS_USED == 'true'
        run: |
          echo "ℹ️ Mindestens ein Apple-Wert ist unter „Variables“ statt „Secrets“ eingetragen – wird trotzdem verwendet."
          if [ "$P8_AS_VAR" = "true" ]; then echo "⚠️ Der private Schlüssel (.p8) ist als Variable öffentlich sichtbar – bitte als Secret anlegen und die Variable löschen."; fi

      - name: Apple-Zugang prüfen
        if: env.ASC_KEY_ID != '' && env.TEAM_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install --quiet pyjwt cryptography
          /tmp/asc/bin/python - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt, re
          key = os.environ["ASC_KEY_P8"].strip()
          kid = os.environ["ASC_KEY_ID"].strip(); iss = os.environ["ASC_ISSUER_ID"].strip(); team = os.environ["TEAM_ID"].strip()
          print(f"Schlüssel-ID: {len(kid)} Zeichen ({'ok' if re.fullmatch(r'[A-Z0-9]{10}', kid) else 'UNGEWÖHNLICH – erwartet 10 Zeichen A-Z/0-9'})")
          print(f"Aussteller-ID: {'ok' if re.fullmatch(r'[0-9a-f-]{36}', iss) else 'UNGEWÖHNLICH – erwartet UUID mit Bindestrichen'}")
          print(f"Team-ID: {'ok' if re.fullmatch(r'[A-Z0-9]{10}', team) else 'UNGEWÖHNLICH – erwartet 10 Zeichen'}")
          print(f".p8: BEGIN-Zeile {'vorhanden' if 'BEGIN PRIVATE KEY' in key else 'FEHLT'}, END-Zeile {'vorhanden' if 'END PRIVATE KEY' in key else 'FEHLT'}")
          # IDs sind keine Geheimnisse – mit Leerzeichen ausgeben, damit GitHub sie nicht als *** maskiert
          print("Schlüssel-ID im Secret:", " ".join(kid))
          print("Aussteller-ID im Secret:", " ".join(iss))
          body = "".join(l for l in key.splitlines() if "PRIVATE KEY" not in l).strip()
          print(f".p8: {len(key.splitlines())} Zeilen, Schlüsseltext {len(body)} Zeichen (üblich: 6 Zeilen, ca. 200 Zeichen)")
          try:
              from cryptography.hazmat.primitives.serialization import load_pem_private_key
              import hashlib
              pk = load_pem_private_key(key.encode(), None)
              from cryptography.hazmat.primitives import serialization
              pub = pk.public_key().public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
              print(".p8: gültiger EC-Schlüssel, Fingerabdruck", hashlib.sha256(pub).hexdigest()[:12])
          except Exception as e:
              print(".p8: NICHT lesbar –", type(e).__name__)
          def call(claims, label):
              try:
                  token = jwt.encode(claims, key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
              except Exception as e:
                  print("❌ Die .p8-Datei ist kein gültiger privater Schlüssel:", type(e).__name__); return False
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=eu.kigenc.app",
                                           headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      apps = json.load(r).get("data", [])
                      print(f"✅ Apple akzeptiert den API-Schlüssel ({label}).")
                      print("✅ App eu.kigenc.app in App Store Connect gefunden." if apps else "❌ Keine App mit Bundle-ID eu.kigenc.app in App Store Connect angelegt.")
                      return True
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="ignore")
                  try: detail = "; ".join(f"{x.get('code')}: {x.get('detail')}" for x in json.loads(body).get("errors", []))
                  except Exception: detail = body[:300]
                  print(f"   {label}: abgelehnt (HTTP {e.code}) {detail[:120]}")
                  return False
          now = int(time.time())
          team_ok = call({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}, "Team-Schlüssel")
          if not team_ok:
              indiv = call({"sub": "user", "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}, "persönlicher Schlüssel")
              if indiv:
                  print("⚠️ Das ist ein PERSÖNLICHER Schlüssel. Xcode braucht einen TEAM-Schlüssel (Integrationen → Team-Schlüssel, Zugriff Admin).")
              else:
                  print("❌ Apple lehnt den Zugang ab: Schlüssel-ID, Aussteller-ID und .p8-Datei gehören nicht zusammen – oder der Schlüssel wurde widerrufen.")
          PY

      - name: Archivieren und zu TestFlight hochladen
        if: env.ASC_KEY_ID != '' && env.TEAM_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && github.ref == 'refs/heads/main'
        working-directory: ios
        run: |
          set -o pipefail
          # Eingaben von Leerzeichen/Zeilenumbrüchen befreien
          KID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISS=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"

          xcodebuild archive -project KIGenC.xcodeproj -scheme KIGenC \
            -destination 'generic/platform=iOS' -archivePath build/KIGenC.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH | tail -20

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath build/KIGenC.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            $AUTH | tail -30
          echo "✅ Build ${{ github.run_number }} an TestFlight übergeben – nach der Verarbeitung (5–30 Min.) in App Store Connect sichtbar."

      - name: Hinweis ohne Apple-Schlüssel
        if: env.ASC_KEY_ID == '' || env.TEAM_ID == '' || env.ASC_ISSUER_ID == '' || env.ASC_KEY_P8 == ''
        run: |
          echo "ℹ️ Nicht alle App-Store-Connect-Secrets gefunden – nur Kompilierprüfung, kein TestFlight-Upload."
          for n in APPLE_TEAM_ID:TEAM_ID APP_STORE_CONNECT_KEY_ID:ASC_KEY_ID APP_STORE_CONNECT_ISSUER_ID:ASC_ISSUER_ID APP_STORE_CONNECT_KEY_P8:ASC_KEY_P8; do
            name=${n%%:*}; var=${n##*:}
            if [ -n "${!var}" ]; then echo "  ✅ $name gesetzt"; else echo "  ❌ $name fehlt"; fi
          done
