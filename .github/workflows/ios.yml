name: iOS-App bauen

on:
  push:
    branches: [main, dev]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Xcode wählen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Projekt erzeugen (XcodeGen)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Kompilieren (Simulator, ohne Signatur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project KIGenC.xcodeproj -scheme KIGenC \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log | head -50; exit 1; }

      - name: Archivieren und zu TestFlight hochladen
        if: env.ASC_KEY_ID != '' && env.TEAM_ID != '' && github.ref == 'refs/heads/main'
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"

          xcodebuild archive -project KIGenC.xcodeproj -scheme KIGenC \
            -destination 'generic/platform=iOS' -archivePath build/KIGenC.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH | tail -20

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath build/KIGenC.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            $AUTH | tail -30
          echo "✅ Build ${{ github.run_number }} an TestFlight übergeben – nach der Verarbeitung (5–30 Min.) in App Store Connect sichtbar."

      - name: Hinweis ohne Apple-Schlüssel
        if: env.ASC_KEY_ID == '' || env.TEAM_ID == ''
        run: echo "ℹ️ Noch keine App-Store-Connect-Secrets – nur Kompilierprüfung, kein TestFlight-Upload."
