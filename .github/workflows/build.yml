name: Build & Release

# Jeder Push auf "main" baut eine signierte APK und veröffentlicht sie als GitHub-Release.
# Die installierte App findet das neue Release und aktualisiert sich selbst.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      # Der Keystore liegt passwortgeschützt (PKCS12, AES-256) im Repo unter signing/.
      # Nur das Passwort ist geheim und steht im Repository-Secret KEYSTORE_PASSWORD.
      - name: Signatur prüfen
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/release.jks ]; then
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KEYSTORE_PASSWORD fehlt – Test-Build mit Debug-Signatur, es wird KEIN Release veröffentlicht."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: eukigenc
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK bereitstellen
        run: cp app/build/outputs/apk/release/app-release.apk EU-KI-GenC.apk

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EU-KI-GenC-1.0.${{ github.run_number }}
          path: EU-KI-GenC.apk

      - name: Release veröffentlichen
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EU KI-GenC 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Neuer Build' }}
          files: EU-KI-GenC.apk
          make_latest: true
