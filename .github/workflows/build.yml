name: Build & Release

# Jeder Push auf "main" baut eine signierte APK und veröffentlicht sie als GitHub-Release.
# Die installierte App findet das neue Release und aktualisiert sich selbst.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Signatur-Schlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -f signing/release.jks ]; then
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signatur-Schlüssel gefunden – Build wird mit Debug-Schlüssel signiert."
          fi

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK bereitstellen
        run: cp app/build/outputs/apk/release/app-release.apk EU-KI-GenC.apk

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EU-KI-GenC-1.0.${{ github.run_number }}
          path: EU-KI-GenC.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EU KI-GenC 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Neuer Build' }}
          files: EU-KI-GenC.apk
          make_latest: true
